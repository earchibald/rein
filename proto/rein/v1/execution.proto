syntax = "proto3";

package rein.v1;

option go_package = "github.com/earchibald/rein/gen/go/rein/v1;reinv1";

import "rein/v1/types.proto";

// ExecutionService manages workflow executions stored by the daemon.
service ExecutionService {
  // List executions stored in the daemon.
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);
  // Get a single execution by id.
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);
  // Inspect an execution with workflow drilldown details.
  rpc InspectExecution(InspectExecutionRequest) returns (InspectExecutionResponse);
  // Start a workflow execution for an issue.
  rpc StartExecution(StartExecutionRequest) returns (StartExecutionResponse);
  // Cancel a running execution.
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
}

message ListExecutionsRequest {
  // Paginate execution results. Pass JSON matching PageRequest.
  PageRequest page = 1;
  // Filter executions by issue id.
  string issue_id = 2;
  // Filter executions by status.
  ExecutionStatus status = 3;
}

message ListExecutionsResponse {
  repeated Execution executions = 1;
  PageResponse page = 2;
}

message GetExecutionRequest {
  // Execution identifier.
  string id = 1;
}

message GetExecutionResponse {
  Execution execution = 1;
}

message InspectExecutionRequest {
  // Execution identifier.
  string id = 1;
}

message InspectExecutionResponse {
  Execution execution = 1;
  Issue issue = 2;
  Workflow workflow = 3;
  repeated ExecutionTaskStep task_steps = 4;
  repeated ExecutionSideEffect side_effects = 5;
  repeated Adapter adapters = 6;
  LookingGlassState looking_glass = 7;
}

message ExecutionTaskStep {
  string phase_id = 1;
  string phase_name = 2;
  string adapter_id = 3;
  string lane = 4;
  string direction = 5;
  string operation = 6;
  string status = 7;
  int32 sequence = 8;
  string error = 9;
}

message ExecutionSideEffect {
  string phase_id = 1;
  string phase_name = 2;
  string adapter_id = 3;
  string lane = 4;
  string direction = 5;
  string operation = 6;
  string status = 7;
  int32 sequence = 8;
  string reason = 9;
  string target_phase = 10;
  map<string, string> inputs = 11;
  map<string, string> outputs = 12;
  string error = 13;
}

message LookingGlassState {
  bool supported = 1;
  bool available = 2;
  repeated string adapter_ids = 3;
  string status = 4;
}

message StartExecutionRequest {
  // Issue identifier.
  string issue_id = 1;
  // Workflow identifier.
  string workflow_id = 2;
  // Actor requesting the execution.
  string requested_by = 3;
  // Execution input values. Pass a JSON object.
  map<string, string> inputs = 4;
}

message StartExecutionResponse {
  Execution execution = 1;
}

message CancelExecutionRequest {
  // Execution identifier.
  string id = 1;
  // Human-readable cancellation reason.
  string reason = 2;
}

message CancelExecutionResponse {
  Execution execution = 1;
}
