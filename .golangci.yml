version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - dogsled
    - durationcheck
    - errcheck
    - exhaustive
    - forbidigo
    - gocritic
    - godot
    - gofmt
    - goimports
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    goimports:
      local-prefixes: github.com/earchibald/rein
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    exhaustive:
      default-signifies-exhaustive: true

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - unparam
